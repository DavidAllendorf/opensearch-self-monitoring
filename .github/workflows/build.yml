name: Build plugins
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  opensearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash gradlew :opensearch-plugin:test :opensearch-plugin:pluginZip
      - uses: actions/upload-artifact@v4
        with:
          name: opensearch-plugin
          path: opensearch-plugin/build/distributions/*.zip
  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: self-monitoring
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: npm ci && npm test
        working-directory: self-monitoring
      - run: |
          corepack prepare yarn@1.22.19 --activate
          git clone --depth 1 --branch 3.9.0 https://github.com/opensearch-project/OpenSearch-Dashboards.git
          cd OpenSearch-Dashboards
          yarn osd bootstrap
      - run: bash self-monitoring/scripts/build-dashboards.sh "$GITHUB_WORKSPACE/OpenSearch-Dashboards"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboards-plugin
          path: self-monitoring/artifacts/*.zip
